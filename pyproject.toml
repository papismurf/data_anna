[project]
name = "data-anna"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.3.3",
    "streamlit>=1.50.0",
    "ta-lib>=0.6.7",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.13.3",
]

[tool.pytest.ini_options]
adopts = "--maxfail=1 --cov=data_anna"

[tool.ruff.lint]
extend-select = ["B"]